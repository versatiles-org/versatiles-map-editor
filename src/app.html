<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Every page is the index.html of a folder, with paths relative to it. Opened without the
			// slash at the end, e.g. "/editor" instead of "/editor/", as some web servers and CDNs serve
			// it, those paths would point to the folder above, and the page would not start.
			if (!location.pathname.endsWith('/') && !location.pathname.split('/').pop().includes('.')) {
				// not the rest of this page, which would load its scripts from the folder above
				window.stop();
				location.replace(location.pathname + '/' + location.search + location.hash);
			}
		</script>
		<!-- relative to the page, so they are found also in a subfolder; the SVG where browsers can draw it -->
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="16x16 24x24" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!-- for the home screen of phones, which round its corners and fill transparency with black -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		%sveltekit.head%
		<style>
			.wrapper {
				position: absolute;
				width: 100vw;
				height: 100vh;
				box-sizing: border-box;
			}
		</style>
	</head>

	<body data-sveltekit-preload-data="hover" style="margin: 0">
		<div>%sveltekit.body%</div>
	</body>
</html>
