name: Release the editor

# Builds the editor when a tag like "v3.1.0" is pushed by "npm run release", and adds the build as a
# ZIP archive to its GitHub release, for others to run on their own web server. The tag must match
# the version in package.json; a release candidate has a tag like "v4.0.0-rc.1". ("map-state-v…" tags release the package; the tags v1.x and v2.x
# come from the history of node-versatiles-svelte, before the editor was extracted.)
#
# It can also be started by hand for a tag, e.g. when the push of the tag started no workflow:
# GitHub starts none for a push of more than three tags at once.
on:
  push:
    tags: ['v*', '!v1.*', '!v2.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag of the release, e.g. "v3.0.0"'
        required: true
        type: string

jobs:
  release:
    name: Build and publish the archive
    runs-on: ubuntu-latest
    permissions:
      # to create the release
      contents: write
    env:
      # the pushed tag, or the one given by hand; only used through the environment, as it is typed
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::\"$TAG\" is no tag like v3.0.0 or v4.0.0-rc.1"
            exit 1
          fi

      # the code of the tag, also when started by hand from another branch
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      # No npm cache: a tag runs with the rights of the repository, so it does not use a cache that
      # other runs have written (cache poisoning).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check that the tag matches the version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match version $version in package.json"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      # The commit has passed CI on main; the unit tests and the types once more, as the build is published
      - name: Test
        run: npm run check-types && npm run test-unit

      - name: Build
        run: npm run build

      # In a folder of its own, so unpacking the archive does not spread the files
      - name: Pack the archive
        run: |
          mkdir release
          cp -r build release/versatiles-map-editor
          # the page of the Playwright tests of embedded maps, not for a web server of the editor
          rm -r release/versatiles-map-editor/iframe-test
          (cd release && zip -r -q "versatiles-map-editor-$VERSION.zip" versatiles-map-editor)

      # "npm run release" creates the release with its notes right after pushing the tag, so usually
      # before this job gets here; if not, the job creates it, and the release tool adds the notes
      - name: Publish the archive in the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            # a release candidate as a prerelease
            prerelease=false
            if [[ "$TAG" == *-rc.* ]]; then prerelease=true; fi
            gh release create "$TAG" --verify-tag --notes "" --prerelease="$prerelease"
          fi
          gh release edit "$TAG" --title "Map Editor $VERSION"
          gh release upload "$TAG" "release/versatiles-map-editor-$VERSION.zip" --clobber
