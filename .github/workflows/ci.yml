name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint Code
        run: npm run lint

      # the graph in the README must match the code; regenerate it with "npm run doc-graph"
      - name: Check that the dependency graph is up to date
        run: npm run doc-graph && git diff --exit-code -- docs/dependency-graph.svg README.md

      - name: Build the project
        run: npm run build

      # The app uses the package from its source, so its own build is checked here
      - name: Build the npm package @versatiles/map-state
        run: npm run build --workspaces

      # that it can still be generated; the Pages workflow publishes it
      - name: Build the API documentation of the package
        run: npm run doc-api

      - name: Check the files of the npm package
        run: npm pack --dry-run --workspace packages/map-state

      - name: Test Code with coverage
        run: npm run test-coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  playwright:
    name: Playwright (${{ matrix.name }})
    # macOS: headless Firefox on the Linux runners cannot create a WebGL context
    # ("AllowWebgl2:false restricts context creation on this system"), so MapLibre
    # never renders and every Firefox test times out.
    runs-on: macos-latest
    permissions:
      contents: read
    # The tests in 5 parallel jobs: GitHub runs 5 macOS jobs at a time here, and more jobs waited
    # for a free runner (9 jobs took 11 minutes, the last 4 started 3 minutes late). All tests take
    # about 15 minutes in Chromium and about 20 in Firefox, which renders several times slower on
    # these runners; each job builds the editor first, about half a minute. So Chromium runs in 2
    # jobs and Firefox in 3, of about 7 minutes each. The jobs share the tests one by one
    # ("fullyParallel" in playwright.config.ts), so they have about the same work.
    strategy:
      # the other jobs go on, so one run shows all failing tests
      fail-fast: false
      matrix:
        include:
          - { name: chromium 1/2, project: chromium, shard: 1/2 }
          - { name: chromium 2/2, project: chromium, shard: 2/2 }
          - { name: firefox 1/3, project: firefox, shard: 1/3 }
          - { name: firefox 2/3, project: firefox, shard: 2/3 }
          - { name: firefox 3/3, project: firefox, shard: 3/3 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The browser of the job, of the installed Playwright version
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.project }}

      # Responses of the tile server and the geocoder, so the tests do not depend on them; one cache
      # per job, whose tests request other tiles
      - name: Cache server responses
        uses: actions/cache@v6
        with:
          path: playwright-tests/.request-cache
          key: playwright-requests-${{ matrix.project }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: |
            playwright-requests-${{ matrix.project }}-${{ strategy.job-index }}-
            playwright-requests-

      - name: Test Playwright
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          path: |
            test-results
            playwright-report
          name: playwright-test-report-${{ strategy.job-index }}
