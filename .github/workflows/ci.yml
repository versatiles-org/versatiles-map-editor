name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint Code
        run: npm run lint

      # the graph in the README must match the code; regenerate it with "npm run doc-graph"
      - name: Check that the dependency graph is up to date
        run: npm run doc-graph && git diff --exit-code -- docs/dependency-graph.svg README.md

      - name: Build the project
        run: npm run build

      # The app uses the package from its source, so its own build is checked here
      - name: Build the npm package @versatiles/map-state
        run: npm run build --workspaces

      # that it can still be generated; the site has it at /api/
      - name: Build the API documentation of the package
        run: npm run doc-api

      # The site of GitHub Pages, as built and tested here, with the API documentation: of a push to
      # main, or a run by hand on main. The job "deploy" publishes it once all tests have passed.
      - name: Upload the site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

      - name: Check the files of the npm package
        run: npm pack --dry-run --workspace packages/map-state

      # the built editor as the package @versatiles/map-editor, which a release publishes
      - name: Check the files of the npm package of the editor
        run: npm run pack-editor && npm pack --dry-run ./release/npm

      - name: Test Code with coverage
        run: npm run test-coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  playwright:
    name: Playwright (${{ matrix.name }})
    # macOS: headless Firefox on the Linux runners cannot create a WebGL context
    # ("AllowWebgl2:false restricts context creation on this system"), so MapLibre
    # never renders and every Firefox test times out.
    runs-on: macos-latest
    permissions:
      contents: read
    # The tests in 5 parallel jobs: GitHub runs 5 macOS jobs at a time here, and more jobs waited
    # for a free runner (9 jobs took 11 minutes, the last 4 started 3 minutes late). All tests take
    # about 15 minutes in Chromium and about 20 in Firefox, which renders several times slower on
    # these runners; each job builds the editor first, about half a minute. So Chromium runs in 2
    # jobs and Firefox in 3, of about 7 minutes each. The jobs share the tests one by one
    # ("fullyParallel" in playwright.config.ts), so they have about the same work.
    strategy:
      # the other jobs go on, so one run shows all failing tests
      fail-fast: false
      matrix:
        include:
          - { name: chromium 1/2, project: chromium, shard: 1/2 }
          - { name: chromium 2/2, project: chromium, shard: 2/2 }
          - { name: firefox 1/3, project: firefox, shard: 1/3 }
          - { name: firefox 2/3, project: firefox, shard: 2/3 }
          - { name: firefox 3/3, project: firefox, shard: 3/3 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The browser of the job, of the installed Playwright version
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install ${{ matrix.project }}

      # Responses of the tile server and the geocoder, so the tests do not depend on them; one cache
      # per job, whose tests request other tiles. Entries never expire: raise the number in the key
      # when the tile server changes, e.g. its TileJSON (2: land cover moved to its own tiles)
      - name: Cache server responses
        uses: actions/cache@v6
        with:
          path: playwright-tests/.request-cache
          key: playwright-requests-2-${{ matrix.project }}-${{ strategy.job-index }}-${{ github.run_id }}
          restore-keys: |
            playwright-requests-2-${{ matrix.project }}-${{ strategy.job-index }}-
            playwright-requests-2-

      - name: Test Playwright
        run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          path: |
            test-results
            playwright-report
          name: playwright-test-report-${{ strategy.job-index }}

  # Every change on main is deployed once all its tests have passed: the site of the job "test".
  # Here in CI rather than in a workflow of its own after CI, which would start, and skip, a run
  # for every failed or cancelled CI run too. A newer push cancels this run as a whole, see
  # "concurrency" above; the next one deploys.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, playwright]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one deployment at a time
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
