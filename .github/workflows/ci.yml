name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs of the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Lint Code
        run: npm run lint

      - name: Build the project
        run: npm run build

      # The app uses the package from its source, so its own build is checked here
      - name: Build the npm package @versatiles/map-state
        run: npm run build --workspaces

      - name: Check the files of the npm package
        run: npm pack --dry-run --workspace packages/map-state

      - name: Test Code with coverage
        run: npm run test-coverage

      - name: Upload test coverage
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  playwright:
    name: Playwright
    # macOS: headless Firefox on the Linux runners cannot create a WebGL context
    # ("AllowWebgl2:false restricts context creation on this system"), so MapLibre
    # never renders and every Firefox test times out.
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The browsers of the installed Playwright version
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox

      # Responses of the tile server and the geocoder, so the tests do not depend on them
      - name: Cache server responses
        uses: actions/cache@v4
        with:
          path: playwright-tests/.request-cache
          key: playwright-requests-${{ github.run_id }}
          restore-keys: playwright-requests-

      - name: Test Playwright
        run: npx playwright test

      - name: Upload Playwright Test Results
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          path: |
            test-results
            playwright-report
          name: playwright-test-report
